[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditgym"
version = "3.3.0"
description = "Воспроизводимая RL-среда для дообучения ИИ-аудитора: синтетические компании, скрытые финансовые ошибки, награда по доказательствам"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []   # только стандартная библиотека Python

[project.scripts]
auditgym = "auditgym.__main__:main"

[tool.setuptools]
packages = ["auditgym"]
